<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Glamour Tools{% endblock %}</title>
  <style>
    :root {
      --gold: #c9a84c;
      --gold-dim: rgba(201,168,76,0.15);
      --dark: #141412;
      --dark2: #1e1d1a;
      --dark3: #2a2927;
      --cream: #f7f2ea;
      --cream2: #ede8de;
      --red: #e05252;
      --green: #52a070;
      --serif: 'Georgia', serif;
      --sans: system-ui, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--dark); color: var(--cream); font-family: var(--sans); font-size: 15px; min-height: 100vh; }

    header {
      background: var(--dark2);
      border-bottom: 1px solid var(--gold-dim);
      padding: 0 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 56px;
    }
    header .brand { font-family: var(--serif); font-size: 1.1rem; color: var(--gold); letter-spacing: 0.05em; }
    header nav a { color: var(--cream2); text-decoration: none; margin-left: 1.5rem; font-size: 0.9rem; opacity: 0.8; }
    header nav a:hover { color: var(--gold); opacity: 1; }

    main { max-width: 960px; margin: 0 auto; padding: 2rem 1.5rem; }

    h1 { font-family: var(--serif); font-size: 1.6rem; color: var(--gold); margin-bottom: 1.5rem; font-weight: 400; }
    h2 { font-family: var(--serif); font-size: 1.1rem; color: var(--cream); margin-bottom: 1rem; font-weight: 400; }

    .card {
      background: var(--dark2);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 8px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }

    table { width: 100%; border-collapse: collapse; }
    th { text-align: left; padding: 0.5rem 0.75rem; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--gold); border-bottom: 1px solid var(--gold-dim); }
    td { padding: 0.65rem 0.75rem; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 0.9rem; vertical-align: middle; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: rgba(255,255,255,0.02); }

    .btn {
      display: inline-block;
      padding: 0.5rem 1.1rem;
      border-radius: 5px;
      font-size: 0.85rem;
      cursor: pointer;
      border: none;
      text-decoration: none;
      font-family: var(--sans);
    }
    .btn-gold { background: var(--gold); color: var(--dark); font-weight: 600; }
    .btn-gold:hover { background: #d4b05e; }
    .btn-outline { background: transparent; border: 1px solid var(--gold); color: var(--gold); }
    .btn-outline:hover { background: var(--gold-dim); }
    .btn-sm { padding: 0.3rem 0.7rem; font-size: 0.8rem; }

    .form-group { margin-bottom: 1.1rem; }
    label { display: block; font-size: 0.82rem; color: var(--cream2); margin-bottom: 0.35rem; text-transform: uppercase; letter-spacing: 0.05em; }
    input[type=text], input[type=email], input[type=number], textarea {
      width: 100%;
      background: var(--dark3);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 5px;
      color: var(--cream);
      padding: 0.55rem 0.75rem;
      font-size: 0.95rem;
      font-family: var(--sans);
      outline: none;
    }
    input:focus, textarea:focus { border-color: var(--gold); }
    textarea { resize: vertical; min-height: 80px; }

    .line-row { display: grid; grid-template-columns: 1fr 130px 36px; gap: 0.6rem; align-items: center; margin-bottom: 0.5rem; }
    .line-row input { margin: 0; }
    .remove-line { background: none; border: none; color: var(--red); cursor: pointer; font-size: 1.1rem; padding: 0; line-height: 1; }

    .flash { padding: 0.7rem 1rem; border-radius: 5px; margin-bottom: 1rem; font-size: 0.9rem; }
    .flash.success { background: rgba(82,160,112,0.15); border: 1px solid var(--green); color: var(--green); }
    .flash.error { background: rgba(224,82,82,0.15); border: 1px solid var(--red); color: var(--red); }

    .badge { display: inline-block; padding: 0.2rem 0.55rem; border-radius: 4px; font-size: 0.75rem; font-weight: 600; }
    .badge-warn { background: rgba(201,168,76,0.2); color: var(--gold); }
    .badge-danger { background: rgba(224,82,82,0.2); color: var(--red); }

    .empty { color: rgba(255,255,255,0.3); font-style: italic; padding: 1rem 0.75rem; font-size: 0.9rem; }
    .total-row td { font-weight: 600; color: var(--gold); border-top: 1px solid var(--gold-dim); }
  </style>
</head>
<body>
  <header>
    <span class="brand">Glamour Upholstery — Tools</span>
    <nav>
      <a href="/">Dashboard</a>
      <a href="/new-estimate">New Estimate</a>
    </nav>
  </header>
  <main>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}
        <div class="flash {{ cat }}">{{ msg }}</div>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
