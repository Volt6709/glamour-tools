{% extends "base.html" %}
{% block title %}Add Lead — Glamour Tools{% endblock %}
{% block content %}

<h1>Add Lead</h1>

<form method="POST">
  <div class="card">
    <div class="grid2">
      <div class="form-group">
        <label>Name *</label>
        <input type="text" name="name" placeholder="e.g. Marie Burgos" required>
      </div>
      <div class="form-group">
        <label>Firm</label>
        <input type="text" name="firm" placeholder="e.g. Marie Burgos Design">
      </div>
    </div>
    <div class="grid2">
      <div class="form-group">
        <label>Email</label>
        <input type="email" name="email" placeholder="info@example.com">
      </div>
      <div class="form-group">
        <label>Phone</label>
        <input type="text" name="phone" placeholder="212-000-0000">
      </div>
    </div>
    <div class="form-group">
      <label>Location</label>
      <input type="text" name="location" placeholder="e.g. NYC, Newark NJ">
    </div>
    <div class="form-group" style="margin-bottom:0;">
      <label>Notes</label>
      <textarea name="notes" placeholder="How you found them, what they specialize in, etc."></textarea>
    </div>
  </div>

  <div style="display:flex; gap:0.75rem; justify-content:flex-end;">
    <a href="/outreach" class="btn btn-outline">Cancel</a>
    <button type="submit" class="btn btn-gold">Add Lead</button>
  </div>
</form>

{% endblock %}
