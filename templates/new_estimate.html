{% extends "base.html" %}
{% block title %}New Estimate — Glamour Tools{% endblock %}
{% block content %}

<h1>New Estimate</h1>

<form method="POST" action="/new-estimate">
  <div class="card">
    <h2 style="margin-bottom:1.2rem;">Client</h2>
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:1rem;">
      <div class="form-group">
        <label>Client Name *</label>
        <input type="text" name="client_name" placeholder="e.g. John Smith" required>
      </div>
      <div class="form-group">
        <label>Client Email</label>
        <input type="email" name="client_email" placeholder="email@example.com">
      </div>
    </div>
  </div>

  <div class="card">
    <h2 style="margin-bottom:1.2rem;">Line Items</h2>
    <div style="display:grid; grid-template-columns:1fr 130px 36px; gap:0.6rem; margin-bottom:0.4rem;">
      <span style="font-size:0.8rem; text-transform:uppercase; letter-spacing:0.05em; color:var(--gold);">Description</span>
      <span style="font-size:0.8rem; text-transform:uppercase; letter-spacing:0.05em; color:var(--gold);">Amount ($)</span>
      <span></span>
    </div>
    <div id="lines">
      <div class="line-row">
        <input type="text" name="description[]" placeholder="e.g. Labor — sofa reupholstery">
        <input type="number" name="amount[]" placeholder="0.00" min="0" step="0.01">
        <button type="button" class="remove-line" onclick="removeLine(this)">×</button>
      </div>
    </div>
    <button type="button" class="btn btn-outline btn-sm" onclick="addLine()" style="margin-top:0.75rem;">
      + Add Line
    </button>
  </div>

  <div class="card">
    <h2 style="margin-bottom:1rem;">Note to Client</h2>
    <div class="form-group" style="margin-bottom:0;">
      <textarea name="message" placeholder="Optional — appears on the estimate for the client"></textarea>
    </div>
  </div>

  <div style="display:flex; gap:1rem; justify-content:flex-end;">
    <a href="/" class="btn btn-outline">Cancel</a>
    <button type="submit" class="btn btn-gold">Create Estimate</button>
  </div>
</form>

<script>
function addLine() {
  const row = document.createElement('div');
  row.className = 'line-row';
  row.innerHTML = `
    <input type="text" name="description[]" placeholder="e.g. Materials — fabric">
    <input type="number" name="amount[]" placeholder="0.00" min="0" step="0.01">
    <button type="button" class="remove-line" onclick="removeLine(this)">×</button>
  `;
  document.getElementById('lines').appendChild(row);
}

function removeLine(btn) {
  const rows = document.querySelectorAll('.line-row');
  if (rows.length > 1) btn.closest('.line-row').remove();
}
</script>
{% endblock %}
